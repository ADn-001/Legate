server {
    listen 80;
    server_name _;
    # Must exceed the 500 MB video limit (FR-28) + AES-GCM overhead, since all
    # media uploads go through PUT /api/capsules/{id}/media/{mid}/upload (P2).
    client_max_body_size 512M;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — trailing slash strips the /api prefix
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so clients can't spoof their way past
        # per-IP rate limits with a forged X-Forwarded-For (uvicorn runs
        # with --forwarded-allow-ips="*" and must only ever see our value).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    # Never cache index.html; long-cache hashed assets
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}

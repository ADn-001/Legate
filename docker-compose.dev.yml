# Development override. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    volumes:
      - ./backend:/app
    # Dev-only: publish the API port for the local `npm run dev` frontend and
    # for running backend e2e tests from the host. Production compose keeps
    # the api container reachable only through nginx.
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    volumes:
      - ./backend:/app

  beat:
    volumes:
      - ./backend:/app

  redis:
    ports:
      - "6379:6379"
